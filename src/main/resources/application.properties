spring.application.name=websocket-Data-Connection

# ---- Secrets ---------------------------------------------------------------
# The Finnhub API key is never stored in this file (or anywhere inside src/, which is
# packaged into the jar). Provide it in one of two ways:
#   1. the FINNHUB_API_KEY environment variable, or
#   2. "finnhub.api-key=<your key>" in ./application-local.properties (git-ignored).
spring.config.import=optional:file:./application-local.properties
finnhub.api-key=${FINNHUB_API_KEY:}

# ---- Live feed (Finnhub WebSocket) ------------------------------------------
finnhub.websocket-url=wss://ws.finnhub.io
# Comma-separated. Crypto symbols trade 24/7, so there is always data to look at.
finnhub.symbols=BINANCE:BTCUSDT
# Set to false to run the app (and the tests) without connecting to Finnhub.
finnhub.stream-enabled=true
finnhub.max-reconnect-delay=60s

# ---- Storage ----------------------------------------------------------------
storage.csv-path=data/trades.csv
# Trades kept in memory for the live analysis endpoints (older ones are only in the CSV).
storage.memory-retention=2h
storage.memory-max-trades=500000

# ---- Historical data (Binance public REST API, no key needed) ---------------
history.binance-base-url=https://api.binance.com
# Fail fast instead of hanging if Binance is slow or unreachable.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s
